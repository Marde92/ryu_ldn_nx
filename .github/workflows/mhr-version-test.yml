name: MHR LDN diagnostic sysmodule and overlay

on:
  push:
    branches:
      - test/mhr-16-0-2-version
      - test/ldn-id-diagnostics
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compile:
    name: Compile Switch sysmodule test
    runs-on: ubuntu-latest
    container: ghcr.io/ethiquema/ryu_ldn_nx:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare prebuilt Atmosphere library
        run: |
          git config --global --add safe.directory '*'
          LIB_DIR="${GITHUB_WORKSPACE}/sysmodule/Atmosphere-libs/libstratosphere/lib/nintendo_nx_arm64_armv8a/release"
          PREBUILT="/opt/ryu_ldn_nx/libstratosphere/lib/nintendo_nx_arm64_armv8a/release/libstratosphere.a"
          test -f "$PREBUILT"
          mkdir -p "$LIB_DIR"
          ln -sf "$PREBUILT" "$LIB_DIR/libstratosphere.a"
      - name: Build sysmodule
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          # npdmtool cannot reliably parse the workspace-mounted JSON in this container.
          cp "${GITHUB_WORKSPACE}/sysmodule/res/app.json" /tmp/mhr-app.json
          for tool in npdmtool elf2nso build_pfs0 nacptool; do
            real="/opt/devkitpro/tools/bin/$tool"
            if [ ! -f "$real.real" ]; then mv "$real" "$real.real"; fi
            cat > "$real" <<'WRAPPER'
          #!/bin/bash
          self="${0}.real"
          name="$(basename "$0")"
          if [ "$name" = "npdmtool" ] && [ -f "$1" ]; then
            staged="/tmp/$(basename "$1").$$"
            cp "$1" "$staged"
            shift
            set -- "$staged" "$@"
          fi
          exec env -u LD_PRELOAD "$self" "$@"
          WRAPPER
            chmod +x "$real"
          done
          cd "${GITHUB_WORKSPACE}/sysmodule"
          make -j4 all APP_JSON=/tmp/mhr-app.json
          mkdir -p "${GITHUB_WORKSPACE}/mhr-test-package/atmosphere/contents/4200000000000010"
          cp ryu_ldn_nx.nsp "${GITHUB_WORKSPACE}/mhr-test-package/atmosphere/contents/4200000000000010/exefs.nsp"
          cp ryu_ldn_nx.npdm "${GITHUB_WORKSPACE}/mhr-test-package/atmosphere/contents/4200000000000010/main.npdm"
          cd "${GITHUB_WORKSPACE}/overlay"
          make -j4 all
          mkdir -p "${GITHUB_WORKSPACE}/mhr-test-package/switch/.overlays"
          cp ryu_ldn_nx_overlay.ovl "${GITHUB_WORKSPACE}/mhr-test-package/switch/.overlays/ryu_ldn_nx_overlay.ovl"
      - name: Upload version test package
        uses: actions/upload-artifact@v4
        with:
          name: ryu-ldn-nx-MHR-16.0.2-test
          path: mhr-test-package/
          if-no-files-found: error
